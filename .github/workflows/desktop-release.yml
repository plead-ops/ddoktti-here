name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: --bundles nsis
          - os: macos-latest
            platform: macos
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Mac targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test tests/*.test.mjs services/slack-relay/*.test.mjs
      - run: pnpm build
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build signed release packages
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SLACK_RELAY_URL: ${{ vars.SLACK_RELAY_URL }}
          DIAG_SLACK_WEBHOOK: ${{ secrets.DIAG_SLACK_WEBHOOK }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }} --verbose
      - name: Verify Mac signature, notarization and universal binary
        if: runner.os == 'macOS'
        run: |
          app=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/ddoktti-here"
      - name: Verify Windows installer upgrade from 0.1.9
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-upgrade.ps1
      - name: Prepare platform assets
        run: node scripts/release-assets.mjs prepare ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify updater signatures and merge all platforms
        run: node scripts/release-assets.mjs merge all
      - uses: actions/upload-artifact@v4
        with:
          name: release-verified
          path: release-assets/*
          if-no-files-found: error
      - name: Upload complete draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          draft: true
      - name: Publish only after every asset was uploaded
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
