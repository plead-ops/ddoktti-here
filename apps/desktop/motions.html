<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>똑띠 모션 라이브러리</title><link rel="stylesheet" href="/src/motions.css"></head><body>
<header><span class="eyebrow">DDOKTTI · MOTION LIBRARY</span><h1>똑띠의 하루, 모든 순간.</h1><p>산책부터 꾸벅꾸벅 졸음까지. 앱에 들어간 동작과 감정을 모아봤어요.</p><p><a href="/surfaces.html">창 위 산책·등반·점프 체험 →</a></p><div class="note">디자인 검토용 페이지 · 실제 알림이나 계정에 연결하지 않아요. 앱에는 동작 선택 메뉴가 없어요.</div></header>
<div class="toolbar"><div class="controls"><button id="play" class="primary">전체 일시정지</button><button id="restart">처음부터</button><button id="step">한 단계 +100ms</button><label>속도 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label>배경 <select id="background"><option value="paper">크림</option><option value="dark">어두움</option><option value="grid">투명 격자</option></select></label><label><input id="reduced" type="checkbox"> 모션 줄이기</label><label><input id="travel" type="checkbox" checked> 걷기·달리기 이동</label></div><nav aria-label="동작 분류"><button data-filter="all" aria-pressed="true">전체 <span>31</span></button><button data-filter="daily" aria-pressed="false">일상</button><button data-filter="emotion" aria-pressed="false">감정</button><button data-filter="interaction" aria-pressed="false">상호작용</button><button data-filter="alert" aria-pressed="false">알림</button></nav></div>
<main><p id="status" role="status">그림을 불러오는 중…</p><div id="gallery"></div></main><footer>실제 앱과 같은 원본 기반 SVG 프레임·재생 시간·발 위치 기준을 사용합니다. 검토를 위해 동작은 반복되며, 낙하 이동은 카드 안에서 시뮬레이션합니다.</footer><script type="module" src="/src/motions.ts"></script></body></html>
