<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계정 연결 · 똑띠왔어요</title>
<style>
:root{color-scheme:light;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263d35;background:#f2f5ee}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(ellipse at 18% 5%,#dcebd2 0,transparent 50%),radial-gradient(ellipse at 95% 95%,#f4e5c8 0,transparent 45%)}main{width:min(100%,490px)}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;margin:0 0 22px 5px}.dot{width:12px;height:12px;background:#55966a;border-radius:50%;box-shadow:0 0 0 5px #55966a18}.card{background:#fffef9;border:1px solid #d9e1d4;border-radius:30px;padding:38px 34px;box-shadow:0 16px 60px #344c3a0c}.badge{width:64px;height:64px;border-radius:22px;background:#e8f1e2;color:#3e7750;display:grid;place-items:center;font-size:30px;margin-bottom:26px}.state-cancelled .badge,.state-failed .badge{background:#fff0d8;color:#9e6429}h1{font-size:27px;letter-spacing:-1px;line-height:1.4;margin:0 0 13px}p{font-size:15px;line-height:1.85;margin:0;color:#617067;word-break:keep-all}.next{margin-top:28px;padding:18px 20px;border-radius:16px;background:#f0f4eb;border:1px solid #e2e9da}.next strong{font-size:14px;display:block;margin-bottom:5px;color:#35553e}.next p{font-size:13px}.footer{font-size:12px;text-align:center;margin-top:22px;color:#7c887d}@media(max-width:480px){.card{padding:28px 24px;border-radius:24px}h1{font-size:24px}}
</style></head><body class="state-{{STATE}}"><main><div class="brand"><span class="dot" aria-hidden="true"></span>똑띠왔어요</div><section class="card" aria-labelledby="title"><div class="badge" aria-hidden="true">{{ICON}}</div><h1 id="title">{{TITLE}}</h1><p>{{BODY}}</p><div class="next"><strong>{{NEXT}}</strong><p>{{HELP}}</p></div></section><p class="footer">이 탭은 닫아도 괜찮아요.</p></main></body></html>
