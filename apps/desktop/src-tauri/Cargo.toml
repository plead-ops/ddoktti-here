[package]
name = "ddoktti-here"
version = "0.1.9"
description = "똑띠왔어요 — 슬랙 알림 오버레이"
authors = ["plead"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
resvg = { version = "0.47", default-features = false }
tauri = { version = "~2.12.0", features = ["tray-icon", "image-png", "macos-private-api", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "~2.12.0"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "query", "rustls"] }
chrono = "0.4"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
url = "2"
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Windows 유휴 시간 감지
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }
winreg = "0.52" # 로그인 자동시작(HKCU Run 키) 관리

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
