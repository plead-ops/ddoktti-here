<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>똑띠</title><link rel="stylesheet" href="/src/pet.css"></head><body>
<div id="pet-root" hidden><section id="bubble" hidden aria-live="polite"><div class="bubble-head"><h2 id="title"></h2><button id="dismiss" aria-label="알림 닫기">×</button></div><p id="body"></p><img id="preview" alt="첨부 사진 미리보기" hidden><div id="slack-actions" class="slack-actions" hidden><div class="emoji-row" role="group" aria-label="이모지로 답하기"><button type="button" data-react="+1" aria-label="좋아요">👍</button><button type="button" data-react="white_check_mark" aria-label="확인">✅</button><button type="button" data-react="eyes" aria-label="보는 중">👀</button><button type="button" data-react="pray" aria-label="감사">🙏</button><button type="button" data-react="raised_hands" aria-label="최고">🙌</button></div><form id="reply-form" class="reply-form"><input id="reply-text" type="text" maxlength="2000" placeholder="바로 답글 보내기" autocomplete="off" aria-label="답글"><button type="submit">보내기</button></form></div><div class="bubble-actions"><button id="ack-alert">확인</button><button id="open">열기</button><button id="meeting" hidden>회의 참여</button><button id="snooze" hidden>5분 뒤</button><button id="next-alert" hidden>다음 알림</button><span id="count"></span></div></section>
<button id="pet" aria-label="클릭해서 간지럽히기. 졸 때 클릭하면 깨우기. 우클릭 메뉴, 드래그 이동"><svg id="sprite" viewBox="0 0 400 260" aria-hidden="true"></svg></button><div id="pet-reaction" hidden>간지러워요!</div>
<div id="pet-menu" hidden><button id="pet-menu-close" type="button" data-action="close" aria-label="메뉴 닫기"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button><b>똑띠와 잠깐</b><div id="pet-timer-running" hidden><span id="pet-timer-left"></span><button type="button" data-timer="pause" id="pet-timer-pause">일시정지</button><button type="button" data-timer="cancel">중지</button></div><form id="pet-timer"><label><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M9 2h6m-3 3v-3m0 6v5l3 2"/></svg>타이머 <input id="pet-minutes" type="number" min="1" max="1440" value="25" aria-label="타이머 분"> 분</label><button type="submit">시작</button></form><div id="pet-timer-presets" role="group" aria-label="바로 시작"><button type="button" data-minutes="5">5분</button><button type="button" data-minutes="15">15분</button><button type="button" data-minutes="25">25분</button><button type="button" data-minutes="50">50분</button></div><button id="pet-quiet" data-action="quiet"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18h6m-9-3V9a6 6 0 0 1 12 0v6l2 2H4z"/></svg><span id="pet-quiet-label">30분 동안 알림 끄기</span></button><div id="pet-agenda" hidden><span class="pet-agenda-title">다음 일정</span><ul id="pet-agenda-list"></ul></div><p id="pet-held" hidden></p><button id="pet-recent-toggle" type="button" aria-expanded="false" aria-controls="pet-recent-list"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4M12 8v4l3 2"/></svg>최근 알림</button><ul id="pet-recent-list" hidden></ul><button data-action="settings"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>설정 열기</button></div><div id="pet-error" role="status" hidden><span id="pet-error-text"></span><span class="pet-error-actions"><button type="button" id="pet-error-action" hidden>Slack 다시 연결</button><button type="button" id="pet-error-close" aria-label="안내 닫기">닫기</button></span></div></div><script type="module" src="/src/overlay.ts"></script></body></html>
