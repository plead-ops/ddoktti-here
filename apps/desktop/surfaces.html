<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>똑띠 창 위 산책 미리보기</title><link rel="stylesheet" href="/src/surfaces-preview.css"></head><body>
<header><a href="/ui-preview.html">← 설정 미리보기</a><h1>창 위에서도, 똑띠의 산책.</h1><p>똑띠를 창 위에 내려놓거나, 창을 움직이고 닫아보세요. 등반과 점프는 스스로 결정해요.</p></header>
<div class="controls"><button id="reset">처음 자리로</button><button id="restore">닫힌 창 다시 열기</button><button id="notify">알림 도착</button><label><input id="reduce" type="checkbox" role="switch">동작 줄이기</label><span id="state" role="status">준비 중…</span></div>
<div class="scroll"><main id="desktop" aria-label="창 이동과 캐릭터 착지를 체험하는 바탕화면"><div class="desktop-note">오늘은 조금 높은 곳까지.</div>
<article id="window-a" class="demo-window"><div class="titlebar"><b>작업 노트</b><button data-hide="window-a" aria-label="작업 노트 최소화">−</button><button data-hide="window-a" aria-label="작업 노트 닫기">×</button></div><div class="paper"><small>오늘의 메모</small><h2>집중하고,<br>가끔은 쉬어가기.</h2><i></i><i></i><i></i></div><button class="resize" aria-label="작업 노트 크기 조절">↘</button></article>
<article id="window-b" class="demo-window"><div class="titlebar"><b>이번 주 일정</b><button data-hide="window-b" aria-label="이번 주 일정 최소화">−</button><button data-hide="window-b" aria-label="이번 주 일정 닫기">×</button></div><div class="paper"><small>여유 있는 오후</small><h2>잠깐의 산책도<br>일상의 일부니까.</h2><i></i><i></i></div><button class="resize" aria-label="일정 창 크기 조절">↘</button></article>
<svg id="pet-canvas" viewBox="0 0 1000 700" width="1000" height="700" aria-hidden="true"></svg><div id="notice" hidden><b>곧 회의가 시작돼요</b><p>안전하게 착지하고 소식을 전해요.</p><button id="dismiss-notice">확인</button></div><div class="floor"></div></main></div>
<footer>브라우저 검토용 가상 창입니다. 실제 앱과 같은 이동·충돌 엔진과 그림을 사용하며, 다른 앱의 창을 움직이거나 내용을 읽지 않습니다.</footer><script type="module" src="/src/surfaces-preview.ts"></script></body></html>
